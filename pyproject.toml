[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "moderatorim-sdk"
version = "0.0.0"
description = "ModeratorIM app SDK — the contract kernel external apps build against (Manifest, models, the DataStore port, the App/Ctx/Page routing facade, and the event bus). Ships no runtime; core implements it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Kenson" }]
keywords = ["moderatorim", "sdk", "app", "plugin", "contracts"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 1 - Planning",
]
# The SDK is a CONTRACT kernel — declarations only, no runtime. It deliberately pulls in NO heavy
# dependencies (no starlette, no asyncpg): an external app installs this alone to author against it.
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.9.6",
    "mypy==1.15.0",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
]

[project.urls]
Homepage = "https://moderatorim.com"

[tool.hatch.build.targets.wheel]
# Ship the moderatorim.sdk subpackage. No src/moderatorim/__init__.py exists — `moderatorim` is a
# PEP 420 namespace shared with moderatorim-core, so neither package owns the namespace root.
packages = ["src/moderatorim"]

# ---------------------------------------------------------------------------
# Tooling config (mirrors moderatorim-core)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["moderatorim"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
namespace_packages = true
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["moderatorim.sdk"]
branch = true
